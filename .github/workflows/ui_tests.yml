name: UI Tests
on:
  push:
  pull_request:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
jobs:
  ui-tests:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            playwright_cache_path: ~/.cache/ms-playwright
          - os: windows-latest
            playwright_cache_path: ~\AppData\Local\ms-playwright
          - os: macos-latest
            playwright_cache_path: ~/Library/Caches/ms-playwright
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ matrix.playwright_cache_path }}
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Install Playwright browsers
        run: playwright install --with-deps chromium firefox webkit
      - name: Run tests
        shell: bash
        run: |
          cd week-3-playwright-polish
          pytest tests \
            --html=report.html \
            --self-contained-html \
            --timeout=60 \
            --reruns 2 \
            --reruns-delay 2
      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-test-report-${{ matrix.os }}
          path: week-3-playwright-polish/report.html