name: API Tests
on: [push, pull_request]

jobs:
  api-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API tests
        shell: bash
        run: |
          cd week-4-api-testing
          pytest tests \
            --html=report.html \
            --self-contained-html

      - name: Upload API test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-report-${{ matrix.os }}
          path: week-4-api-tests/report.html
